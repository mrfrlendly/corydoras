[package]
name = "corydoras-mcp"
version = "0.9.2"
edition = "2021"
license = "MIT"
description = "MCP server (stdio) that gives agents read access to Corydoras design languages"

[[bin]]
name = "corydoras-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
corydoras-core = { path = "../corydoras-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
