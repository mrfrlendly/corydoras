[package]
name = "corydoras-core"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Library, analysis pipeline and agent text for Corydoras"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
ego-tree = "0.10"
hayro = "0.9.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
pdf-extract = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Account sign-in: random values, SHA-256 and the RS256 check of an ID token.
# The same version that the TLS stack already uses.
ring = "0.17"
tokio = { version = "1", features = ["time", "macros", "sync", "rt", "net", "io-util"] }
trash = "5"
uuid = { version = "1", features = ["v4"] }
# 3MF models, slicer project files and library snapshots.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Video frames (AVFoundation). Same versions as Tauri uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSDictionary"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
