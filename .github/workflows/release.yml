name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --bundles app
      - name: Zip app
        run: |
          ditto -c -k --keepParent target/release/bundle/macos/Corydoras.app "Corydoras-${GITHUB_REF_NAME#v}-macOS-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: Corydoras-*-macOS-arm64.zip
